<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #F3EEE6;
            touch-action: manipulation;
            overflow: hidden;
        }

        #board {
            width: 100vw;
            height: 100vw;
            max-height: 100vh;
            margin: 0 auto;
        }

        .sq-selected { box-shadow: inset 0 0 4px 4px rgba(246,246,105,0.95); }
        .sq-legal    { box-shadow: inset 0 0 4px 4px rgba(0,0,0,0.25); }
        .sq-lastmove { box-shadow: inset 0 0 4px 4px rgba(106,174,215,0.80); }
    </style>
</head>
<body>

<div id="board"></div>

<script>
    var board        = null;
    var game         = new Chess();
    var isReadOnly   = false;
    var viewingIndex = -1;

    var selectedSquare = null;
    var lastTapMs      = 0;
    var lastTapSquare  = null;

    function clearHighlights() {
        $('#board .square-55d63').removeClass('sq-selected sq-legal sq-lastmove');
        selectedSquare = null;
    }

    function clearSelectionHighlights() {
        $('#board .square-55d63').removeClass('sq-selected sq-legal');
        selectedSquare = null;
    }

    function addHighlight(sq, cls) {
        $('#board .square-' + sq).addClass(cls);
    }

    function showLegalDots(sq) {
        try {
            var moves = game.moves({ square: sq, verbose: true });
            for (var i = 0; i < moves.length; i++) {
                addHighlight(moves[i].to, 'sq-legal');
            }
        } catch(e) {}
    }

    function showLastMove(from, to) {
        $('#board .square-55d63').removeClass('sq-lastmove');
        if (from) addHighlight(from, 'sq-lastmove');
        if (to)   addHighlight(to,   'sq-lastmove');
    }

    function isAtLatest() {
        var len = game.history().length;
        return len === 0 ? (viewingIndex === -1) : (viewingIndex === len - 1);
    }

    function isDuplicateTap(square) {
        var now = Date.now();
        var duplicate = lastTapSquare === square && (now - lastTapMs) < 350;
        lastTapMs = now;
        lastTapSquare = square;
        return duplicate;
    }

    function selectSquare(square) {
        clearSelectionHighlights();
        selectedSquare = square;
        addHighlight(square, 'sq-selected');
        showLegalDots(square);
    }

    function handleSquareTap(square) {
        if (isReadOnly)    return;
        if (!isAtLatest()) return;
        if (game.game_over()) return;
        if (!square)       return;

        var piece = game.get(square);

        if (selectedSquare === null) {
            if (piece && piece.color === game.turn()) {
                selectSquare(square);
            }
            return;
        }

        if (selectedSquare === square) {
            clearSelectionHighlights();
            return;
        }

        var move = null;
        try { move = game.move({ from: selectedSquare, to: square, promotion: 'q' }); }
        catch(e) { move = null; }

        if (move === null) {
            if (piece && piece.color === game.turn()) {
                selectSquare(square);
            } else {
                clearSelectionHighlights();
            }
            return;
        }

        viewingIndex = game.history().length - 1;
        clearSelectionHighlights();
        board.position(game.fen(), false);
        showLastMove(move.from, move.to);
        notifyAndroid(move);
    }

    $(document).on('pointerup click', '.square-55d63', function (event) {
        event.preventDefault();
        event.stopPropagation();

        var square = $(this).attr('data-square');
        if (isDuplicateTap(square)) return;

        handleSquareTap(square);
    });

    function notifyAndroid(move) {
        try {
            var fen  = game.fen();
            var pgn  = game.pgn();
            var san  = move ? (move.san || '') : '';
            var turn = game.turn();
            if (typeof AndroidBridge !== 'undefined' && AndroidBridge !== null) {
                AndroidBridge.onPlayerMove(fen, pgn, san, turn);
            }
        } catch(e) {}
    }

    function stripPgn(raw) {
        if (!raw || !raw.trim()) return '';
        return raw
            .replace(/\[[^\]]*\]\s*/g, '')
            .replace(/\s*(1-0|0-1|1\/2-1\/2|\*)\s*$/, '')
            .trim();
    }

    setTimeout(function () {
        board = Chessboard('board', {
            draggable:  false,
            position:   'start',
            pieceTheme: 'img/chesspieces/wikipedia/{piece}.png'
        });
        $(window).resize(board.resize);
    }, 300);

    function loadFromPgn(pgnText) {
        if (!pgnText || !pgnText.trim()) return;
        if (!board) { setTimeout(function(){ loadFromPgn(pgnText); }, 200); return; }
        try {
            var stripped = stripPgn(pgnText);
            var tempGame = new Chess();
            var ok = tempGame.load_pgn(stripped);

            if (ok === false) {
                tempGame = new Chess();
                ok = tempGame.load_pgn(pgnText.replace(/\s*(1-0|0-1|1\/2-1\/2|\*)\s*$/, '').trim());
            }

            if (ok !== false) {
                game = tempGame;
            }

            viewingIndex = game.history().length - 1;
            board.position(game.fen(), false);
            clearHighlights();
        } catch(e) {}
    }

    function updateBoardFromFen(fen) {
        if (!fen || !fen.trim()) return;
        if (!board) { setTimeout(function(){ updateBoardFromFen(fen); }, 200); return; }
        try {
            game = new Chess(fen);
            viewingIndex = -1;
            board.position(fen, false);
            clearHighlights();
        } catch(e) {}
    }

    function goToMove(index) {
        if (!board) return;
        try {
            var history  = game.history();
            var safeIdx  = Math.max(-1, Math.min(index, history.length - 1));
            viewingIndex = safeIdx;

            if (safeIdx < 0 || history.length === 0) {
                board.position('start', false);
                clearHighlights();
                return;
            }

            var replay = new Chess();
            for (var i = 0; i <= safeIdx; i++) {
                replay.move(history[i]);
            }
            board.position(replay.fen(), false);
            clearHighlights();

            var verboseHistory = replay.history({ verbose: true });
            if (verboseHistory.length > 0) {
                var last = verboseHistory[verboseHistory.length - 1];
                showLastMove(last.from, last.to);
            }
        } catch(e) {}
    }

    function flipBoard() {
        if (board) board.flip();
        clearSelectionHighlights();
    }

    function setReadOnly() {
        isReadOnly = true;
        clearSelectionHighlights();
    }

    function resetBoard() {
        game = new Chess();
        viewingIndex = -1;
        if (board) board.start(false);
        clearHighlights();
    }
</script>
</body>
</html>
